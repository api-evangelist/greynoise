components:
  securitySchemes:
    APIKeyHeaderAuth:
      type: apiKey
      in: header
      name: key
      description: GreyNoise API key passed via the 'key' HTTP header.
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: Success
      required:
        - message
    CVEAdvancedResponse:
      type: object
      properties:
        id:
          type: string
          description: The CVE identifier.
          example: CVE-2024-12345
        details:
          $ref: '#/components/schemas/CVEDetails'
        timeline:
          $ref: '#/components/schemas/CVETimeline'
        exploitation_details:
          $ref: '#/components/schemas/CVEExploitationDetails'
        exploitation_stats:
          $ref: '#/components/schemas/CVEExploitationStats'
        exploitation_activity:
          $ref: '#/components/schemas/CVEExploitationActivity'
    CVEBasicResponse:
      type: object
      properties:
        id:
          type: string
          description: The CVE identifier.
          example: CVE-2024-12345
        details:
          $ref: '#/components/schemas/CVEDetails'
        timeline:
          $ref: '#/components/schemas/CVETimeline'
        exploitation_details:
          $ref: '#/components/schemas/CVEExploitationDetails'
    CVEMinimalResponse:
      type: object
      properties:
        id:
          type: string
          description: The CVE identifier.
          example: CVE-2024-12345
        details:
          $ref: '#/components/schemas/CVEDetails'
    CVEDetails:
      type: object
      properties:
        vulnerability_name:
          type: string
          description: The name of the vulnerability.
          example: Sample Vulnerability
        vulnerability_description:
          type: string
          description: Description of the vulnerability.
          example: This vulnerability allows remote attackers to execute arbitrary code.
        cve_cvss_score:
          type: number
          description: The CVSS score of the CVE.
          example: 7.5
        product:
          type: string
          description: The product affected by the vulnerability.
          example: Sample Product
        vendor:
          type: string
          description: The vendor of the affected product.
          example: Sample Vendor
        published_to_nist_nvd:
          type: boolean
          description: Whether the CVE is published to the NIST National Vulnerability Database.
          example: true
    CVETimeline:
      type: object
      properties:
        cve_published_date:
          type: string
          format: date
          description: The date the CVE was published.
          example: '2024-01-01'
        cve_last_updated_date:
          type: string
          format: date
          description: The date the CVE was last updated.
          example: '2024-01-02'
        first_known_published_date:
          type: string
          format: date
          description: The first known published date of the CVE.
          example: '2024-01-01'
        cisa_kev_date_added:
          type: string
          format: date
          description: The date the CVE was added to the CISA KEV list.
          example: '2024-01-03'
    CVEExploitationDetails:
      type: object
      properties:
        attack_vector:
          type: string
          description: The attack vector for the CVE.
          example: Network
        exploit_found:
          type: boolean
          description: Whether an exploit has been found for this CVE.
          example: true
        exploitation_registered_in_kev:
          type: boolean
          description: Whether the exploitation is registered in KEV.
          example: true
        epss_score:
          type: number
          description: The EPSS score for the CVE.
          example: 0.8
    CVEExploitationStats:
      type: object
      properties:
        number_of_available_exploits:
          type: integer
          description: The number of available exploits for the CVE.
          example: 5
        number_of_threat_actors_exploiting_vulnerability:
          type: integer
          description: The number of threat actors exploiting the vulnerability.
          example: 3
        number_of_botnets_exploiting_vulnerability:
          type: integer
          description: The number of botnets exploiting the vulnerability.
          example: 2
    CVEExploitationActivity:
      type: object
      properties:
        activity_seen:
          type: boolean
          description: Whether exploitation activity has been observed.
          example: true
        benign_ip_count_1d:
          type: integer
          description: The count of benign IPs in the last day.
          example: 100
        benign_ip_count_10d:
          type: integer
          description: The count of benign IPs in the last 10 days.
          example: 500
        benign_ip_count_30d:
          type: integer
          description: The count of benign IPs in the last 30 days.
          example: 1000
        threat_ip_count_1d:
          type: integer
          description: The count of threat IPs in the last day.
          example: 10
        threat_ip_count_10d:
          type: integer
          description: The count of threat IPs in the last 10 days.
          example: 50
        threat_ip_count_30d:
          type: integer
          description: The count of threat IPs in the last 30 days.
          example: 100
    CallbackFilterFields:
      type: object
      description: Common filter fields for callback IP queries.
      properties:
        is_stage_1:
          type: boolean
          description: "Filter by stage 1 status. true = file downloaded from this IP.\n"
          example: false
        is_stage_2:
          type: boolean
          description: "Filter by stage 2 status. true = suspected C2 based on VT/sandbox analysis.\n"
          example: false
        first_seen_after:
          type: string
          format: date
          description: Only include IPs first seen after this date (YYYY-MM-DD).
          example: '2026-05-01'
        first_seen_before:
          type: string
          format: date
          description: Only include IPs first seen before this date (YYYY-MM-DD).
          example: '2026-05-01'
        last_seen_after:
          type: string
          format: date
          description: Only include IPs last seen after this date (YYYY-MM-DD).
          example: '2026-05-01'
        last_seen_before:
          type: string
          format: date
          description: Only include IPs last seen before this date (YYYY-MM-DD).
          example: '2026-05-01'
        has_files:
          type: boolean
          description: If true, only include IPs with associated malware files. If false, only IPs without files.
          example: false
        file_type:
          type: string
          description: Filter by file MIME type (e.g. "application/x-executable").
          example: string
        file_name:
          type: string
          description: Filter by file name substring match.
          example: Google Public DNS
        file_hash:
          type: string
          description: Filter by file SHA256 hash.
          example: 795bc7ce13f60d61e9ac03611dd36d90
        scanner_ips:
          type: array
          items:
            type: string
          description: Filter to IPs associated with these scanner IPs.
          example: *id001
        ips:
          type: array
          items:
            type: string
          description: Filter to this specific set of callback IPs.
          example: *id002
    CallbackFileResponse:
      type: object
      description: Malware file associated with a callback IP.
      properties:
        sha256:
          type: string
          description: SHA-256 hash of the file.
          example: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        md5:
          type: string
          description: MD5 hash of the file.
          example: 795bc7ce13f60d61e9ac03611dd36d90
        sha1:
          type: string
          description: SHA-1 hash of the file.
          example: string
        threat_name:
          type: string
          description: VirusTotal threat name, if available.
          example: Trojan.GenericKD.46542
        vt_detection_count:
          type: integer
          description: Number of VirusTotal engines that flagged the file as malicious.
          example: 42
        vt_engine_count:
          type: integer
          description: Total number of VirusTotal engines that scanned the file.
          example: 71
        file_name:
          type: string
          description: Original file name, if known.
          example: payload.bin
        size:
          type: integer
          format: int64
          description: File size in bytes.
          example: 24576
        type:
          type: string
          description: File MIME type.
          example: application/x-executable
    CallbackIPDetailResponse:
      type: object
      description: Detailed information about a single callback IP.
      properties:
        ip:
          type: string
          description: The callback IP address.
          example: 198.51.100.42
        source_workspaces:
          type: array
          items:
            type: string
          description: "Labeled workspace sources where this IP was observed.\nValues are \"GreyNoise\", \"UserWorkspace\", or \"Community\".\n"
          example: *id033
        is_stage_1:
          type: boolean
          description: Whether a file was successfully downloaded from this IP (stage 1).
          example: false
        is_stage_2:
