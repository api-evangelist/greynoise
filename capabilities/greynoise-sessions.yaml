naftiko: 1.0.0-alpha2
info:
  label: GreyNoise API — Sessions
  description: 'Sessions surface of GreyNoise API. 10 operations. Lead operation: Get Sessions. Self-contained Naftiko capability covering one GreyNoise business surface.'
  tags:
    - GreyNoise
    - Security
    - Sessions
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      GREYNOISE_API_KEY: GREYNOISE_API_KEY
capability:
  consumes:
    - type: http
      namespace: greynoise-sessions
      baseUri: https://api.greynoise.io
      description: GreyNoise API — Sessions business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.GREYNOISE_API_KEY}}'
        placement: header
      resources:
        - name: v3-sessions
          path: /v3/sessions
          operations:
            - name: getSessions
              method: GET
              description: Get Sessions
              inputParameters:
                - name: scope
                  in: query
                  type: string
                  required: false
                  description: Controls the data scope for the query.
                - name: start_time
                  in: query
                  type: string
                  required: true
                  description: Start time for the query range (ISO 8601 format).
                - name: end_time
                  in: query
                  type: string
                  required: true
                  description: End time for the query range (ISO 8601 format).
                - name: query
                  in: query
                  type: string
                  required: false
                  description: Lucene query string to filter sessions.
                - name: page
                  in: query
                  type: integer
                  required: false
                  description: Page number for pagination.
                - name: page_size
                  in: query
                  type: integer
                  required: false
                  description: Number of results per page.
                - name: sort_by
                  in: query
                  type: string
                  required: false
                  description: Field to sort results by.
                - name: sort_desc
                  in: query
                  type: string
                  required: false
                  description: Whether to sort in descending order.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
        - name: v3-sessions-connections
          path: /v3/sessions/connections
          operations:
            - name: getSessionConnections
              method: GET
              description: Get Session Connections
              inputParameters:
                - name: scope
                  in: query
                  type: string
                  required: false
                  description: Controls the data scope for the query.
