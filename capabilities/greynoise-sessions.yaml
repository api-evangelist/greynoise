                  in: query
                  type: string
                  required: true
                  description: Start time for the query range (ISO 8601 format).
                - name: end_time
                  in: query
                  type: string
                  required: true
                  description: End time for the query range (ISO 8601 format).
                - name: query
                  in: query
                  type: string
                  required: false
                  description: Lucene query string to filter sessions.
                - name: src_field
                  in: query
                  type: string
                  required: false
                  description: Source field to aggregate on.
                - name: dest_field
                  in: query
                  type: string
                  required: false
                  description: Destination field to aggregate on.
                - name: max_nodes
                  in: query
                  type: integer
                  required: false
                  description: Maximum number of nodes to return.
                - name: min_connections
                  in: query
                  type: integer
                  required: false
                  description: Minimum number of connections to include a node.
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
