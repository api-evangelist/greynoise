openapi: 3.2.0
info:
  title: GreyNoise GNQL API
  version: 3.0.0
  description: GreyNoise is a cybersecurity company that collects and analyzes Internet-wide scan and attack traffic. Use GreyNoise to contextualize existing alerts, filter false-positives, identify compromised devices, and track emerging threats.
  contact:
    email: hello@greynoise.io
  license:
    name: Proprietary
    url: https://www.greynoise.io/terms
servers:
- url: https://api.greynoise.io
  description: Production
security:
- APIKeyHeaderAuth: []
tags:
- name: GNQL
  description: Calls to interface with GNQL (GreyNoise Query Language).
paths:
  /v3/gnql:
    get:
      tags:
      - GNQL
      summary: GNQL V3 Query
      operationId: gnqlV3Query
      description: 'GreyNoise Query Language

        GNQL (GreyNoise Query Language) is a domain-specific query language

        that uses Lucene deep under the hood.'
      parameters:
      - $ref: '#/components/parameters/query'
      - in: query
        name: size
        description: The number of results provided per page for paginating through all results of a query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
      - in: query
        name: scroll
        description: Scroll token to paginate through results. Incompatible with `format=csv`.
        required: false
        schema:
          type: string
      - in: query
        name: quick
        description: If true, the response will only include the IP address and the classification or trust level.
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: format
        description: Specifies the desired format of the results. Must be either csv or json.
        required: false
        schema:
          type: string
          enum:
          - csv
          - json
          default: json
      - in: query
        name: exclude
        description: 'Comma-separated list of fields to exclude from the response.

          Recognized top-level response fields (e.g. `tags`, `cves`, `vpn`, `tor`, `raw_data`, `metadata`),

          `metadata.<subfield>` paths (e.g. `metadata.organization`, `metadata.source_country`,

          `metadata.destination_countries`), and `raw_data.<subfield>` paths (e.g. `raw_data.ja3`,

          `raw_data.http.useragent`) are accepted. The special value `tags.details` preserves tag

          identity (id, slug) and strips only the enriched details. Unknown field names return 400.

          '
        required: false
        schema:
          type: string
          example: metadata.organization,metadata.city,raw_data.ja3
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GNQLV3Response'
                - $ref: '#/components/schemas/QuickGNQLV3Response'
              examples:
                GnqlV3Query200Example:
                  summary: Default gnqlV3Query 200 response
                  x-microcks-default: true
                  value:
                    request_metadata:
                      complete: false
                      scroll: 'DnF1ZXJ5VGhlbkZldGNoBQAAAAAAeygtFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAH soLhZBSkhMRHVHOFRLbWtrMmhoNkd5MzRnAAAAAAB7KC8WQUpITER1RzhUS21razJoaDZH eTM0ZwAAAAAAeygxFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAHsoMBZBSkhMRHVHOF RLbWtrMmhoNkd5MzRn

                        '
                      query: last_seen:2019-07-28 classification:malicious
                      adjusted_query: last_seen:2019-07-28 classification:malicious
                      count: 1
                      message: ok
                      restricted_fields:
                      - ip
                      - asn
                      - organization
                      - country
                      - city
                      - region
                    data: []
        '206':
          description: 'Partial content - request partially successful.

            Due to plan limitations, your request only returned a subset of

            fields and/or data. Contact sales@greynoise.io to upgrade your

            plan and unlock full results.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GNQLV3Response'
              examples:
                GnqlV3Query206Example:
                  summary: Default gnqlV3Query 206 response
                  x-microcks-default: true
                  value:
                    request_metadata:
                      complete: false
                      scroll: 'DnF1ZXJ5VGhlbkZldGNoBQAAAAAAeygtFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAH soLhZBSkhMRHVHOFRLbWtrMmhoNkd5MzRnAAAAAAB7KC8WQUpITER1RzhUS21razJoaDZH eTM0ZwAAAAAAeygxFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAHsoMBZBSkhMRHVHOF RLbWtrMmhoNkd5MzRn

                        '
                      query: last_seen:2019-07-28 classification:malicious
                      adjusted_query: last_seen:2019-07-28 classification:malicious
                      count: 1
                      message: ok
                      restricted_fields:
                      - ip
                      - asn
                      - organization
                      - country
                      - city
                      - region
                    data: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v3/gnql/metadata:
    get:
      tags:
      - GNQL
      summary: GNQL V3 Metadata Query
      operationId: gnqlV3MetadataQuery
      description: 'GreyNoise Query Language Metadata Endpoint

        This endpoint provides the same functionality as the main GNQL endpoint

        but with additional field filtering capabilities. It automatically excludes

        raw data from responses and allows you to specify additional fields to exclude.


        The metadata endpoint is designed for use cases where you need to retrieve

        IP intelligence data without the raw scan data, making it more efficient

        for metadata-focused queries.


        _License: The `business_service_intelligence` response field

        requires the BSI Module. Without it, every result returns an empty

        `business_service_intelligence` object; all other fields are

        returned normally._'
      parameters:
      - $ref: '#/components/parameters/query'
      - in: query
        name: size
        description: The number of results provided per page for paginating through all results of a query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 10000
      - in: query
        name: scroll
        description: Scroll token to paginate through results
        required: false
        schema:
          type: string
      - in: query
        name: quick
        description: If true, the response will only include the IP address and the classification or trust level.
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: exclude
        description: 'Comma-separated list of additional fields to exclude from the response.

          `raw_data` is always excluded by this endpoint; specifying it is redundant.

          Recognized top-level response fields (e.g. `tags`, `cves`, `vpn`, `tor`, `metadata`)

          and `metadata.<subfield>` paths (e.g. `metadata.organization`, `metadata.source_country`,

          `metadata.destination_countries`) are accepted. The special value `tags.details`

          preserves tag identity (id, slug) and strips only the enriched details. Unknown

          field names return 400.

          '
        required: false
        schema:
          type: string
          example: metadata.organization,metadata.city,metadata.rdns
      responses:
        '200':
          description: OK - request successful.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/GNQLV3Response'
                - $ref: '#/components/schemas/QuickGNQLV3Response'
              examples:
                GnqlV3MetadataQuery200Example:
                  summary: Default gnqlV3MetadataQuery 200 response
                  x-microcks-default: true
                  value:
                    request_metadata:
                      complete: false
                      scroll: 'DnF1ZXJ5VGhlbkZldGNoBQAAAAAAeygtFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAH soLhZBSkhMRHVHOFRLbWtrMmhoNkd5MzRnAAAAAAB7KC8WQUpITER1RzhUS21razJoaDZH eTM0ZwAAAAAAeygxFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAHsoMBZBSkhMRHVHOF RLbWtrMmhoNkd5MzRn

                        '
                      query: last_seen:2019-07-28 classification:malicious
                      adjusted_query: last_seen:2019-07-28 classification:malicious
                      count: 1
                      message: ok
                      restricted_fields:
                      - ip
                      - asn
                      - organization
                      - country
                      - city
                      - region
                    data: []
        '206':
          description: 'Partial content - request partially successful.

            Due to plan limitations, your request only returned a subset of

            fields and/or data. Contact sales@greynoise.io to upgrade your

            plan and unlock full results.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GNQLV3Response'
              examples:
                GnqlV3MetadataQuery206Example:
                  summary: Default gnqlV3MetadataQuery 206 response
                  x-microcks-default: true
                  value:
                    request_metadata:
                      complete: false
                      scroll: 'DnF1ZXJ5VGhlbkZldGNoBQAAAAAAeygtFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAH soLhZBSkhMRHVHOFRLbWtrMmhoNkd5MzRnAAAAAAB7KC8WQUpITER1RzhUS21razJoaDZH eTM0ZwAAAAAAeygxFkFKSExEdUc4VEtta2syaGg2R3kzNGcAAAAAAHsoMBZBSkhMRHVHOF RLbWtrMmhoNkd5MzRn

                        '
                      query: last_seen:2019-07-28 classification:malicious
                      adjusted_query: last_seen:2019-07-28 classification:malicious
                      count: 1
                      message: ok
                      restricted_fields:
                      - ip
                      - asn
                      - organization
                      - country
                      - city
                      - region
                    data: []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /v3/gnql/stats:
    get:
      tags:
      - GNQL
      summary: GNQL V3 Stats
      operationId: gnqlV3Stats
      description: 'Get aggregate statistics for the top organizations, actors, tags,

        ASNs, countries, classifications, and operating systems of all the

        results of a given GNQL query.'
      parameters:
      - $ref: '#/components/parameters/query'
      - in: query
        name: count
        description: Number of top aggregates to grab
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 10000
          default: 1000
      responses:
        '200':
          description: Query successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GNQLStats'
              examples:
                GnqlV3Stats200Example:
                  summary: Default gnqlV3Stats 200 response
                  x-microcks-default: true
                  value:
                    query: last_seen:2019-07-28 classification:malicious
                    count: 50000
                    adjusted_query: last_seen:2019-07-28 classification:malicious last_seen:7d
                    stats:
                      classifications:
                      - classification: malicious
                        count: 5000
                      spoofable:
                      - spoofable: false
                        count: 5000
                      organizations:
                      - organization: DigitalOcean, LLC
                        count: 5000
                      actors:
                      - actor: Shodan.io
                        count: 5000
                      countries:
                      - country: United States
                        count: 5000
                      source_countries:
                      - country: United States
                        count: 5000
                      destination_countries:
                      - country: United States
                        count: 5000
                      tags:
                      - tag: SSH Bruteforcer
                        id: 4c076d9c-be48-4bd1-bec4-6005e06c0f89
                        count: 5000
                      operating_systems:
                      - operating_system: Windows 7/8
                        count: 5000
                      categories:
                      - category: education
                        count: 5000
                      asns:
                      - asn: AS4134
                        count: 5000
        '206':
          description: 'Partial content - request partially successful.

            Due to plan limitations, your request only returned a subset of

            fields and/or data. The `adjusted_query` field in the response

            indicates how the original query was modified. Contact

            sales@greynoise.io to upgrade your plan and unlock full results.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GNQLStats'
              examples:
                GnqlV3Stats206Example:
                  summary: Default gnqlV3Stats 206 response
                  x-microcks-default: true
                  value:
                    query: last_seen:2019-07-28 classification:malicious
                    count: 50000
                    adjusted_query: last_seen:2019-07-28 classification:malicious last_seen:7d
                    stats:
                      classifications:
                      - classification: malicious
                        count: 5000
                      spoofable:
                      - spoofable: false
                        count: 5000
                      organizations:
                      - organization: DigitalOcean, LLC
                        count: 5000
                      actors:
                      - actor: Shodan.io
                        count: 5000
                      countries:
                      - country: United States
                        count: 5000
                      source_countries:
                      - country: United States
                        count: 5000
                      destination_countries:
                      - country: United States
                        count: 5000
                      tags:
                      - tag: SSH Bruteforcer
                        id: 4c076d9c-be48-4bd1-bec4-6005e06c0f89
                        count: 5000
                      operating_systems:
                      - operating_system: Windows 7/8
                        count: 5000
                      categories:
                      - category: education
                        count: 5000
                      asns:
                      - asn: AS4134
                        count: 5000
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/ExceededLimit'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
components:
  schemas:
    QuickBusinessServiceIntelligence:
      type: object
      properties:
        found:
          type: boolean
          description: 'Indicates if an IP is part of the RIOT dataset or not.

            '
          example: false
        trust_level:
          type: string
          description: "Trust level assigned to this IP/provider. One of:\n  - \"1\" — high trust; broadly used legitimate provider where end-user attribution is high.\n  - \"2\" — moderate trust; common business service infrastructure where end-user attribution is limited.\n  - \"3\" — label only; cloud compute or bulk hosting provider with no inherent trust signal.\n"
          example: '1'
    InternetScannerIntelligence:
      properties:
        ip:
          type: string
          description: IP address that the information is about.
          example: 71.6.135.131
        seen:
          type: boolean
          description: Whether or not the IP address has been observed by the GreyNoise sensor network.
          example: true
        classification:
          type: string
          description: The classification of the IP address, either "benign", "malicious", or "unknown", based on the activity observed by GreyNoise.
          enum:
          - benign
          - malicious
          - unknown
          example: benign
        first_seen:
          type: string
          description: The earliest date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-01-28'
        last_seen:
          type: string
          description: The most recent date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-02-28'
        last_seen_timestamp:
          type: string
          description: The timestamp of the last observed activity from this IP.
          format: date-time
          example: '2025-01-15T12:30:45Z'
        found:
          type: boolean
          description: Indicates if the IP was observed scanning the GreyNoise sensor network. Also referred to as 'noise'.
          example: true
        actor:
          type: string
          description: The overt actor this IP is associated with.
          example: Shodan.io
        spoofable:
          type: boolean
          description: This IP address has been opportunistically scanning the Internet, however has failed to complete a full TCP connection. Any reported activity could be spoofed.
          example: true
        cves:
          type: array
          items:
            type: string
          description: A list of CVEs associate with this IP.
          example:
          - CVE-2020-1234
          - CVE-2021-2345
        tor:
          type: boolean
          description: Whether or not the device is a known Tor exit node.
          example: false
        vpn:
          type: boolean
          description: This IP is associated with a VPN service. Activity, malicious or otherwise, should not be attributed to the VPN service provider.
          example: true
        vpn_service:
          type: string
          description: Name of associated VPN Service.
          example: IPVANISH_VPN
        metadata:
          $ref: '#/components/schemas/MetadataV3'
        tags:
          $ref: '#/components/schemas/IPResponseV3Tags'
        raw_data:
          type: object
          description: Raw data observed directly by GreyNoise.
          properties:
            scan:
              type: array
              items:
                type: object
                properties:
                  port:
                    type: integer
                    description: Port number
                    example: 80
                  protocol:
                    type: string
                    description: Protocol
                    example: TCP
            ja3:
              type: array
              items:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: c3a6cf0bf2e690ac8e1ecf6081f17a50
                    description: JA3 hash fingerprint string
                  port:
                    type: integer
                    example: 443
                    description: TCP port connection that the SSL/TLS communication occurred over
            hassh:
              type: array
              items:
                type: object
                properties:
                  fingerprint:
                    type: string
                    example: 51cba57125523ce4b9db67714a90bf6e
                    description: HASSH hash fingerprint string
                  port:
                    type: integer
                    example: 2222
                    description: 'TCP port connection where the HASSH hash was identified

                      '
            http:
              type: object
              properties:
                md5:
                  type: string
                  description: 'An MD5 hash of the body content. This compact,

                    unique representation of the data allows for quick

                    comparisons and deduplication of payloads without

                    storing the raw content.

                    '
                  example: 9764955b67107eeb9edfae76f429e783
                cookie_keys:
                  type: array
                  description: 'The keys or names of cookies exchanged in the communication.

                    These can reveal session identifiers, tracking mechanisms,

                    or other metadata used in web interactions,

                    providing clues about application behavior or vulnerabilities.

                    '
                  example:
                  - expremotekey
                  items:
                    type: string
                request_authorization:
                  type: array
                  description: 'The contents of the Authorization header in a request,

                    which can include credentials, tokens, or other authentication

                    information.

                    '
                  example:
                  - Bearer exampletoken
                  - Basic username:password
                  items:
                    type: string
                request_cookies:
                  type: array
                  description: 'Key-value pairs stored in cookies sent with an HTTP request.

                    These cookies often contain session identifiers, user preferences,

                    or tracking data, which can be analyzed to detect unauthorized

                    access or manipulation.

                    '
                  example:
                  - session_id=1234567890
                  items:
                    type: string
                request_header:
                  type: array
                  description: 'Request Headers are the keys (names) of HTTP headers

                    that a client sends to a server.

                    '
                  example:
                  - 'Content-Type: application/json'
                  - 'Accept: application/json'
                  items:
                    type: string
                method:
                  type: array
                  description: 'The HTTP method used in the request, such as GET, POST, PUT, or DELETE.

                    Analyzing methods can reveal the intent of the request,

                    such as retrieving or modifying resources,

                    and identify unexpected or suspicious activity.

                    '
                  example:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  items:
                    type: string
                request_origin:
                  type: array
                  description: 'Indicates the origin of the request,

                    typically used in cross-origin resource sharing (CORS)

                    to specify where the request originated.

                    This helps identify unauthorized or potentially

                    malicious cross-origin requests.

                    '
                  example:
                  - 111.111.1.1
                  items:
                    type: string
                host:
                  type: array
                  description: 'The host of the request, which can include the domain name

                    and port number. These values can provide insight into the services or

                    endpoints the actor may have been attempting to interact with.

                    '
                  example:
                  - example.com
                  - example.com:8080
                  items:
                    type: string
                uri:
                  type: array
                  items:
                    type: string
                    description: 'The URI of the request, which can include the path and query parameters.

                      This can provide insight into the specific resource or data being requested.

                      '
                  example:
                  - string
                path:
                  type: array
                  items:
                    type: string
                    description: Observed scanning activity traversed this web path.
                    example: /robots.txt
                  example:
                  - /HNAP1/
                useragent:
                  type: array
                  items:
                    type: string
                    description: Observed scanning activity used these user agents.
                    example: 'Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)

                      '
                  example:
                  - Mozilla/5.0 (compatible; GoogleBot/2.1; +http://www.google.com/bot.html)
                ja4h:
                  type: array
                  items:
                    type: string
                    description: 'List of JA4H HTTP client fingerprints observed in network traffic from the IP.

                      JA4H captures characteristics of HTTP client behavior including method,

                      headers, and cookie fields, useful for identifying and tracking HTTP clients.

                      '
                  example:
                  - ge11cn060000_4e59edc1297a_4da5efaf0cbd
            tls:
              type: object
              properties:
                cipher:
                  type: string
                  description: 'The encryption algorithm or cipher suite used during the

                    secure communication. Identifying the cipher helps assess

                    the security of the connection, particularly in TLS/SSL traffic.

                    '
                  example: TLS_AES_128_GCM_SHA256
                ja4:
                  type: array
                  items:
                    type: string
                    description: 'List of JA4 TLS fingerprints observed in network traffic from the IP.

                      JA4 is a modern fingerprinting method that captures distinctive

                      characteristics of TLS client behavior,

                      useful for identifying and clustering malicious or anomalous clients.

                      '
                  example:
                  - t13d1516h2_8daaf6152771_02713d6af862
            ssh:
              type: object
              properties:
                key:
                  type: array
                  description: 'This is the SSH key used.

                    '
                  example:
                  - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC1234567890
                  items:
                    type: string
                ja4ssh:
                  type: array
                  items:
                    type: string
                    description: 'List of JA4SSH fingerprints observed in network traffic from the IP.

                      JA4SSH captures SSH traffic patterns including packet lengths and

                      directions, useful for identifying SSH client behavior and detecting

                      anomalous sessions.

                      '
                  example:
                  - c76s76_c71s59_c0s0
            tcp:
              type: object
              properties:
                ja4t:
                  type: array
                  items:
                    type: string
                    description: 'List of JA4T TCP fingerprints observed in network traffic from the IP.

                      JA4T captures TCP connection characteristics such as window size,

                      options, and MSS, useful for OS fingerprinting and identifying

                      network stacks.

                      '
                  example:
                  - 64240_2-1-3-1-1-4_1460_8
                ja4l:
                  type: string
                  description: 'JA4L light distance/latency fingerprint observed in network traffic

                    from the IP. Captures TCP TTL and window size characteristics, useful

                    for estimating client-server distance and identifying proxied

                    connections.

                    '
                  example: '1460_64'
            source:
              properties:
                bytes:
                  type: integer
                  description: 'The total amount of data transferred (in bytes) during the observed session or connection.

                    '
                  example: 1024
              example: string
    GNQLV3Response:
      type: object
      properties:
        request_metadata:
          $ref: '#/components/schemas/GNQLV3ResponseMetadata'
        data:
          type: array
          description: The relevant IP records requested by the user
          items:
            $ref: '#/components/schemas/GNQLIPContextV3'
          example: []
    IPResponseV3Tags:
      type: object
      properties:
        id:
          type: string
          example: ef0cc90d-d80c-436f-92c5-3d8f8665c9ac
          description: 'The unique identifier for the tag.

            '
        slug:
          type: string
          example: mirai
          description: 'The slugified version of the tag name.

            '
        name:
          type: string
          example: Mirai
          description: 'The human-readable name for the tag.

            '
        category:
          type: string
          example: worm
          description: 'Category of the IP address such as hosting or ISP.

            '
        intention:
          type: string
          example: malicious
          description: 'The intent of the tag, either suspicious, malicious, benign, or unknown.

            '
        description:
          type: string
          example: This IP address exhibits behavior that indicates it is infected with Mirai or a Mirai-like variant of malware.
          description: 'A detailed description of the tag, including the observed activity

            and any relevant context or details.

            '
        references:
          type: array
          items:
            type: string
            example: https://en.wikipedia.org/wiki/Mirai_(malware)
            description: 'A list of URLs or references that provide additional information

              about the tag and its associated activity.

              '
          example:
          - string
        recommend_block:
          type: boolean
          example: false
          description: 'A boolean value indicating whether the tag should be recommended

            for blocking or filtering purposes.

            '
        cves:
          type: array
          items:
            type: string
            example: CVE-2020-1234
            description: 'A list of CVEs associated with the tag.

              '
          example:
          - CVE-2021-44228
        created_at:
          type: string
          example: '2020-04-07'
          description: 'The date and time when the tag was created.

            '
        updated_at:
          type: string
          example: '2020-04-07'
          description: 'The date and time when the tag was last updated.

            '
    BusinessServiceIntelligence:
      properties:
        found:
          type: boolean
