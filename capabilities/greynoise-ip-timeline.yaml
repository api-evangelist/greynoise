naftiko: 1.0.0-alpha2
info:
  label: GreyNoise API — IP Timeline
  description: 'IP Timeline surface of GreyNoise API. 1 operations. Lead operation: IP Timeline Field Summary. Self-contained Naftiko capability covering one GreyNoise business surface.'
  tags:
    - GreyNoise
    - Security
    - IP Timeline
  created: '2026-05-30'
  modified: '2026-05-30'
binds:
  - namespace: env
    keys:
      GREYNOISE_API_KEY: GREYNOISE_API_KEY
capability:
  consumes:
    - type: http
      namespace: greynoise-ip-timeline
      baseUri: https://api.greynoise.io
      description: GreyNoise API — IP Timeline business capability. Self-contained, no shared references.
      authentication:
        type: apikey
        key: key
        value: '{{env.GREYNOISE_API_KEY}}'
        placement: header
      resources:
        - name: v3-noise-ips-ip-timeline
          path: /v3/noise/ips/{ip}/timeline
          operations:
            - name: getIPTimelineFieldSummary
              method: GET
              description: IP Timeline Field Summary
              inputParameters: []
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: $.
  exposes:
    - type: rest
      namespace: greynoise-ip-timeline-rest
      port: 8080
      description: REST adapter for GreyNoise API — IP Timeline. One Spectral-compliant resource per consumed operation, prefixed with /v1.
      resources:
        - path: /v1/noise/ips/{ip}/timeline
          name: v1-noise-ips-ip-timeline
          description: REST surface for IP Timeline Field Summary.
          operations:
            - method: GET
              name: getIPTimelineFieldSummary
              description: IP Timeline Field Summary
              call: greynoise-ip-timeline.getIPTimelineFieldSummary
              with: {}
              outputParameters:
                - type: object
                  mapping: $.
    - type: mcp
      namespace: greynoise-ip-timeline-mcp
      port: 9090
      transport: http
      description: MCP adapter for GreyNoise API — IP Timeline. One tool per consumed operation, routed inline through this capability's consumes block.
      tools:
        - name: ip-timeline-field-summary
          description: IP Timeline Field Summary
          hints:
            readOnly: true
            destructive: false
            idempotent: true
          call: greynoise-ip-timeline.getIPTimelineFieldSummary
          with: {}
          outputParameters:
            - type: object
              mapping: $.
