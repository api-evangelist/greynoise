    TimeSeriesResponse:
      type: object
      description: "Response object for the timeseries endpoint. The response is a map\nwhere keys are time intervals and values are arrays of IP records\nobserved in that interval.\n\nTime interval keys are formatted as YYYY-MM-DD-HH (e.g., \"2025-01-15-14\")\n"
      additionalProperties:
        description: "Time interval key (format: YYYY-MM-DD-HH)\n"
        type: array
        items:
          $ref: '#/components/schemas/TimeSeriesRecord'
      example: *id006
    TimeSeriesRecord:
      type: object
      description: A single IP record in a timeseries response
      properties:
        ip:
          type: string
          description: The IP address
          example: 203.0.113.45
        internet_scanner_intelligence:
          $ref: '#/components/schemas/TimeSeriesIntelligence'
    TimeSeriesIntelligence:
      type: object
      description: Intelligence data for an IP in the timeseries dataset
      properties:
        first_seen:
          type: string
          description: The earliest date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-01-28'
        last_seen:
          type: string
          description: The most recent date GreyNoise observed any activity from this IP.
          format: date
          example: '2018-02-28'
        found:
          type: boolean
          description: Indicates if the IP was observed scanning the GreyNoise sensor network. Also referred to as 'noise'.
          example: true
        tags:
          type: array
          items:
            type: string
          description: "A list of activity/malware tags GreyNoise has applied to this\nIP.\n"
          example:
            - Mirai
            - Telnet Worm
        actor:
          type: string
          description: The overt actor this IP is associated with.
          example: Shodan.io
        spoofable:
          type: boolean
          description: This IP address has been opportunistically scanning the Internet, however has failed to complete a full TCP connection. Any reported activity could be spoofed.
          example: true
        classification:
          type: string
          description: The classification of the IP address, either "benign", "malicious", or "unknown", based on the activity observed by GreyNoise.
          enum:
            - benign
            - malicious
            - unknown
          example: benign
        cves:
          type: array
          items:
            type: string
          description: A list of CVEs associate with this IP.
          example:
            - CVE-2020-1234
            - CVE-2021-2345
        vpn:
          type: boolean
          description: This IP is associated with a VPN service. Activity, malicious or otherwise, should not be attributed to the VPN service provider.
          example: true
        vpn_service:
          type: string
          description: Name of associated VPN Service.
          example: IPVANISH_VPN
        tor:
          type: boolean
          description: Whether or not the device is a known Tor exit node.
          example: false
        last_seen_timestamp:
          type: string
          description: The timestamp of the last observed activity from this IP.
          format: date-time
          example: '2025-01-15T12:30:45Z'
        metadata:
          $ref: '#/components/schemas/MetadataV3'
        raw_data:
          $ref: '#/components/schemas/TimeSeriesRawData'
    TimeSeriesRawData:
      type: object
      description: Raw data collected about the IP's scanning activity
      properties:
        scan:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesScanEntry'
          description: Observed scan activity
          example: []
        ja3:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesJA3Entry'
          description: JA3 TLS fingerprints observed
          example: []
        hassh:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesHASSHEntry'
          description: HASSH SSH fingerprints observed
          example: []
        http:
          $ref: '#/components/schemas/TimeSeriesHTTPData'
        source:
          $ref: '#/components/schemas/TimeSeriesSourceData'
        tls:
          $ref: '#/components/schemas/TimeSeriesTLSData'
        ssh:
          $ref: '#/components/schemas/TimeSeriesSSHData'
        tcp:
          $ref: '#/components/schemas/TimeSeriesTCPData'
    TimeSeriesScanEntry:
      type: object
      properties:
        port:
          type: integer
          description: Port number
          example: 80
        protocol:
          type: string
          description: Protocol
          example: TCP
    TimeSeriesJA3Entry:
      type: object
      properties:
        fingerprint:
          type: string
          example: c3a6cf0bf2e690ac8e1ecf6081f17a50
          description: JA3 hash fingerprint string
        port:
          type: integer
          example: 443
          description: TCP port connection that the SSL/TLS communication occurred over
    TimeSeriesHASSHEntry:
      type: object
      properties:
        fingerprint:
          type: string
          example: 51cba57125523ce4b9db67714a90bf6e
          description: HASSH hash fingerprint string
        port:
          type: integer
          example: 2222
          description: "TCP port connection where the HASSH hash was identified\n"
    TimeSeriesHTTPData:
      type: object
      description: HTTP-related data observed
      properties:
        md5:
          type: array
          items:
            type: string
          description: "MD5 hashes of the body content. These compact,\nunique representations of the data allow for quick\ncomparisons and deduplication of payloads without\nstoring the raw content.\n"
          example:
            - 9764955b67107eeb9edfae76f429e783
        cookie_keys:
          type: array
          items:
            type: string
          description: "The keys or names of cookies exchanged in the communication.\nThese can reveal session identifiers, tracking mechanisms,\nor other metadata used in web interactions,\nproviding clues about application behavior or vulnerabilities.\n"
          example:
            - expremotekey
        request_authorization:
          type: array
          items:
            type: string
          description: "The contents of the Authorization header in a request,\nwhich can include credentials, tokens, or other authentication\ninformation.\n"
          example:
            - Bearer exampletoken
            - Basic username:password
        request_cookies:
          type: array
          items:
            type: string
          description: "Key-value pairs stored in cookies sent with an HTTP request.\nThese cookies often contain session identifiers, user preferences,\nor tracking data, which can be analyzed to detect unauthorized\naccess or manipulation.\n"
          example:
            - session_id=1234567890
        request_header:
          type: array
          items:
            type: string
          description: "Request Headers are the keys (names) of HTTP headers\nthat a client sends to a server.\n"
          example:
            - 'Content-Type: application/json'
            - 'Accept: application/json'
        method:
          type: array
          items:
            type: string
          description: "The HTTP method used in the request, such as GET, POST, PUT, or DELETE.\nAnalyzing methods can reveal the intent of the request,\nsuch as retrieving or modifying resources,\nand identify unexpected or suspicious activity.\n"
          example:
            - GET
            - POST
            - PUT
            - DELETE
        path:
          type: array
          items:
            type: string
          description: Observed scanning activity traversed this web path.
          example:
            - /robots.txt
        request_origin:
          type: array
          items:
            type: string
          description: "Indicates the origin of the request,\ntypically used in cross-origin resource sharing (CORS)\nto specify where the request originated.\nThis helps identify unauthorized or potentially\nmalicious cross-origin requests.\n"
          example:
            - 111.111.1.1
        useragent:
          type: array
          items:
            type: string
          description: Observed scanning activity used these user agents.
          example:
            - "Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)\n"
        ja4h:
          type: array
          items:
            type: string
          description: "List of JA4H HTTP client fingerprints observed in network traffic from the IP.\nJA4H captures characteristics of HTTP client behavior including method,\nheaders, and cookie fields, useful for identifying and tracking HTTP clients.\n"
          example:
            - ge11cn060000_4e59edc1297a_4da5efaf0cbd
    TimeSeriesSourceData:
      type: object
      description: Source traffic metadata
      properties:
        bytes:
          type: integer
          format: int64
          description: "The total amount of data transferred (in bytes) during the\nobserved session or connection.\n"
          example: 1024
    TimeSeriesTLSData:
      type: object
      description: TLS-related data
      properties:
        cipher:
          type: array
          items:
            type: string
          description: "The encryption algorithms or cipher suites used during secure\ncommunication. Identifying the ciphers helps assess the security\nof the connection, particularly in TLS/SSL traffic.\n"
          example:
            - TLS_AES_128_GCM_SHA256
            - TLS_AES_256_GCM_SHA384
        ja4:
          type: array
          items:
            type: string
          description: "List of JA4 TLS fingerprints observed in network traffic from the IP.\nJA4 is a modern fingerprinting method that captures distinctive\ncharacteristics of TLS client behavior,\nuseful for identifying and clustering malicious or anomalous clients.\n"
          example:
            - t13d1516h2_8daaf6152771_02713d6af862
    TimeSeriesSSHData:
      type: object
      description: SSH-related data
      properties:
        key:
          type: array
          items:
            type: string
          description: "This is the SSH key used.\n"
          example:
            - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC1234567890
        ja4ssh:
          type: array
          items:
            type: string
          description: "List of JA4SSH fingerprints observed in network traffic from the IP.\nJA4SSH captures SSH traffic patterns including packet lengths and\ndirections, useful for identifying SSH client behavior and detecting\nanomalous sessions.\n"
          example:
            - c76s76_c71s59_c0s0
    TimeSeriesTCPData:
      type: object
      description: TCP-related data
      properties:
        ja4t:
          type: array
          items:
            type: string
          description: "List of JA4T TCP fingerprints observed in network traffic from the IP.\nJA4T captures TCP connection characteristics such as window size,\noptions, and MSS, useful for OS fingerprinting and identifying\nnetwork stacks.\n"
          example:
            - 64240_2-1-3-1-1-4_1460_8
        ja4l:
          type: string
          description: "JA4L light distance/latency fingerprint observed in network traffic\nfrom the IP. Captures TCP TTL and window size characteristics, useful\nfor estimating client-server distance and identifying proxied\nconnections.\n"
          example: '1460_64'
    TimeSeriesStatsResponse:
      type: object
      description: "Response object for the timeseries stats/aggregation endpoint.\nThis provides aggregated IP counts over time intervals matching\na GNQL query.\n"
      properties:
        count:
          type: integer
          description: The sum of all IP counts across all time intervals
          example: 1500
        min:
          type: integer
          description: The minimum IP count observed in any single time interval
          example: 10
        max:
          type: integer
          description: The maximum IP count observed in any single time interval
          example: 250
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeSeriesStatsRecord'
          description: Array of aggregated data points, one per time interval
          example: []
      example: *id007
    TimeSeriesStatsRecord:
      type: object
      description: A single aggregated data point in a timeseries stats response
      properties:
        date:
          type: string
          description: "The starting timestamp for this time interval in format\n'YYYY-MM-DD HH:mm:ss.SSS'.\nFor hourly intervals, the time component represents the hour.\nFor daily intervals, the time will be 00:00:00.000.\n"
          example: '2025-11-10 14:00:00.000'
        count:
          type: integer
          description: "The number of unique IPs matching the query in this time\ninterval\n"
          example: 125
